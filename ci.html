<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicação Interna — Painel de Endemias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <img class="brand__logo" src="assets/logo-ponta-pora.png" alt="Prefeitura Municipal de Ponta Porã">
      <span class="brand__divider" aria-hidden="true"></span>
      <span class="brand__name">Vigilância em Endemias</span>
    </div>
    <a class="topbar__back" href="index.html">← Painel</a>
  </div>
</header>

<main class="page page--tool">

  <div class="hero">
    <h1 class="title">Comunicação Interna</h1>
    <p class="subtitle">Digite ou dite a comunicação, deixe a IA revisar o texto e gerar um assunto, e baixe o documento pronto.</p>
  </div>

  <div class="tool-panel">

    <section class="folga-section">
      <div class="folga-row">
        <label class="folga-field">
          <span>Número da CI <small>(o modelo já tem "/2026" fixo — digite só o número, ex: 042)</small></span>
          <input type="text" id="ciNumero" placeholder="Ex: 042">
        </label>
        <label class="folga-field">
          <span>Para (Secretaria) <small>{{Secretaria}}</small></span>
          <input type="text" id="ciSecretaria" value="Secretaria Municipal de Saúde">
        </label>
      </div>
    </section>

    <section class="folga-section">
      <h3 class="folga-section__title">Texto da comunicação</h3>
      <div class="ci-textarea-wrap">
        <textarea id="ciTexto" class="ci-textarea" rows="8" placeholder="Digite o texto da comunicação, ou use o microfone para ditar..."></textarea>
        <button type="button" id="ciMic" class="ci-mic" title="Ditar por voz">🎤</button>
      </div>
      <p class="folga-count" id="ciMicStatus"></p>

      <div class="folga-row" style="margin-top:0.6rem">
        <button type="button" id="ciMelhorar" class="folga-btn folga-btn--ghost">✨ Melhorar texto</button>
      </div>
      <p class="folga-count" id="ciIaStatus"></p>
    </section>

    <section class="folga-section">
      <h3 class="folga-section__title">Assunto</h3>
      <div class="folga-row">
        <input type="text" id="ciAssunto" class="folga-input" placeholder="Gerado automaticamente ao melhorar o texto, ou digite o seu">
      </div>
    </section>

    <p class="folga-status" id="ciStatus"></p>

    <div class="modal__actions">
      <button type="button" id="ciGerar" class="folga-btn folga-btn--primary">Gerar Comunicação (.docx)</button>
    </div>

  </div>

  <footer class="foot">
    <p>Comunicação Interna — Prefeitura Municipal de Ponta Porã.</p>
  </footer>

</main>

<script src="jszip.local.js"></script>
<script src="docx-utils.js"></script>
<script src="ci-config.js"></script>
<script src="ci.js"></script>
</body>
</html>
